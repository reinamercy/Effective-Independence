# DATASET CONFIGURATION
#
# Sources verified 2026-08-11 (see logs/decisions.md). Grading rules mirror
# project_spec.yaml and must stay consistent with it.

datasets:
  gpqa_diamond:
    source: "huggingface:Idavidrein/gpqa:gpqa_diamond"
    gated: true                 # requires accepting terms at huggingface.co/datasets/Idavidrein/gpqa
                                 # and an HF_TOKEN with access, set in .env
    raw_path: "data/raw/gpqa_diamond.jsonl"
    processed_path: "data/processed/gpqa_diamond.jsonl"
    full_n: 198
    approx_n: 8
    format: "multiple_choice"
    grader: "src/graders/gpqa_grader.py"

  math:
    source: "huggingface:DigitalLearningGmbH/MATH-lighteval"
    levels: [4, 5]               # filtered client-side from the full level 1-5 set
    gated: false
    raw_path: "data/raw/math.jsonl"
    processed_path: "data/processed/math.jsonl"
    full_n: 300
    approx_n: 11
    format: "free_response"
    grader: "src/graders/math_grader.py"

  simpleqa:
    source: "https://openaipublic.blob.core.windows.net/simple-evals/simple_qa_test_set.csv"
    gated: false
    raw_path: "data/raw/simpleqa.csv"
    processed_path: "data/processed/simpleqa.jsonl"
    full_n: 300
    approx_n: 11
    format: "free_response"
    grader: "src/graders/simpleqa_grader.py"
